<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrong Password! 🥺</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@300;400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5684348194282572" crossorigin="anonymous"></script>

    <!-- Website Icon (Favicon) -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="shortcut icon" href="assets/images/favicon.png">

    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #ffd1d8, #fff0f5);
        }
        .wrong-password-card {
            text-align: center;
            padding: 50px;
            max-width: 500px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .wrong-password-card i {
            font-size: 5rem;
            color: var(--deep-red);
            text-shadow: 0 0 20px rgba(255, 75, 106, 0.4);
            animation: floatHeart 3s ease-in-out infinite both;
        }
        .wrong-title {
            font-size: 3rem;
            color: var(--primary-pink);
            font-family: var(--font-handwriting);
        }
        .back-btn {
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 1.1rem;
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    
    <div class="wrong-password-card glass-card glowing-border">
        <i class="fas fa-heart-broken"></i>
        <h1 class="wrong-title">Oops! Wrong Password</h1>
        <p style="color: var(--text-muted); font-size: 1.1rem; line-height: 1.6;">
            The secret key you entered doesn't match! 
            Only Nisha and Krishna know the true password to unlock their beautiful memories. 🥺❤️
        </p>
        <button class="glowing-btn back-btn" onclick="window.location.href='index.html'">
            <i class="fas fa-undo"></i> Try Again
        </button>
    </div>

</body>
</html>
